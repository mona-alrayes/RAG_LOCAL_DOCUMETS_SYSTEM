services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - '127.0.0.1:${DB_FORWARD_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
    ports:
      - '127.0.0.1:${REDIS_FORWARD_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:${QDRANT_FORWARD_PORT:-6333}:6333'
    volumes:
      - qdrant_data:/qdrant/storage

  security-worker:
    build:
      context: .
      dockerfile: docker/security-worker/Dockerfile
    restart: unless-stopped
    init: true
    working_dir: /var/www/html
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --queue=${CLAMAV_SCAN_QUEUE:-security-scan}
      - --sleep=1
      - --tries=1
      - --timeout=${CLAMAV_SCAN_TIMEOUT:-300}
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CLAMAV_SIGNATURE_DIR: /var/lib/clamav
      AI_SERVICE_BASE_URL: http://host.docker.internal:8001
    volumes:
      - ./:/var/www/html
      - clamav_signatures:/var/lib/clamav
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue-worker:
    build:
      context: .
      dockerfile: docker/security-worker/Dockerfile
    restart: unless-stopped
    init: true
    working_dir: /var/www/html
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --queue=${PROCESSING_QUEUE:-default}
      - --sleep=1
      - --tries=3
      - --timeout=330
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      AI_SERVICE_BASE_URL: http://host.docker.internal:8001
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-local-worker:
    build:
      context: .
      dockerfile: docker/security-worker/Dockerfile
    restart: unless-stopped
    init: true
    working_dir: /var/www/html
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --queue=${LOCAL_AI_QUEUE:-ai-local}
      - --sleep=1
      - --tries=3
      - --timeout=330
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      LOCAL_AI_QUEUE_CONCURRENCY: ${LOCAL_AI_QUEUE_CONCURRENCY:-1}
      AI_SERVICE_BASE_URL: http://host.docker.internal:8001
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/security-worker/Dockerfile
    restart: unless-stopped
    init: true
    working_dir: /var/www/html
    command:
      - php
      - artisan
      - schedule:work
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
    name: mysql_data

  redis_data:
    name: redis_data

  clamav_signatures:
    name: clamav_signatures

  qdrant_data:
    name: qdrant_data
