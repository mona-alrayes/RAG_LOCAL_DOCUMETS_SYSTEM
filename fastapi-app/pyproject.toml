[project]
name = "rag-ai-service"
version = "0.1.0"
description = "FastAPI service for AI and RAG capabilities."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "huggingface-hub==1.30.0",
    "httpx2==2.12.0",
    "python-multipart==0.0.20",
    "llama-cloud==2.14.1",
    "llama-index-core==0.14.24",
    "llama-index-embeddings-jinaai==0.6.0",
    "pydantic-settings==2.12.0",
    "qdrant-client==1.19.0",
    "uvicorn==0.52.4",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
local-native = [
    "psutil>=7.2.2,<8",
    "transformers>=4.51.0",
    "fastembed==0.8.0",
    "torch==2.13.0",
]
test = [
    "pytest==9.1.1",
    "httpx2==2.12.0",
]
